---
- name: Update and upgrade all packages to the latest version
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600
  when: system_upgrade | default(true) | bool

- name: Remove orphaned dependencies with purge
  ansible.builtin.apt:
    autoremove: true
    purge: true
  register: apt_cleanup_result

- name: Clean stale package cache
  ansible.builtin.apt:
    autoclean: true

- name: Registrar resultado de la purga de paquetes huerfanos
  ansible.builtin.debug:
    msg: "Resultado de la limpieza:\n{{ apt_cleanup_result.stdout }}"
  when: apt_cleanup_result.changed

- name: Create PATH_DATA base directory
  ansible.builtin.file:
    path: "{{ PATH_DATA }}"
    state: directory
    mode: "0755"

- name: Create persistence directory
  ansible.builtin.file:
    path: "{{ PATH_DATA }}/persistence"
    state: directory
    mode: "0755"

- name: Create media directory tree (uid 1000 for linuxserver.io containers)
  ansible.builtin.file:
    path: "{{ PATH_DATA }}/media/{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    - downloads
    - downloads/complete
    - downloads/incomplete
    - movies
    - tvseries
    - watch
