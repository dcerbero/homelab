---
- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Tailscale GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}.gpg"
    dest: /etc/apt/keyrings/tailscale.asc
    mode: "0644"

- name: Ensure python3-apt for deb822_repository
  ansible.builtin.apt:
    name: python3-apt
    state: present

- name: Remove legacy Tailscale apt list file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/tailscale.list
    state: absent

- name: Add Tailscale repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: /etc/apt/keyrings/tailscale.asc
    state: present

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present

- name: Start Tailscale service
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: yes

- name: Authenticate Tailscale with auth key
  ansible.builtin.command: tailscale up --authkey={{ tailscale_auth_key }} --hostname={{ TAILSCALE_HOSTNAME }}
  vars:
    tailscale_auth_key: "{{ vars['TAILSCALE_AUTH_KEY_' ~ (TAILSCALE_HOSTNAME | upper)] | default(TAILSCALE_AUTH_KEY | default('')) }}"
  changed_when: false
  failed_when: false

- name: Get Tailscale IP
  ansible.builtin.command: tailscale ip -4
  register: tailscale_ip
  changed_when: false

- name: Display Tailscale information
  ansible.builtin.debug:
    msg: |
      ✅ Tailscale configured successfully
      IP: {{ tailscale_ip.stdout }}
      Hostname: {{ TAILSCALE_HOSTNAME }}
