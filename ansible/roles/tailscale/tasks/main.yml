---
- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Tailscale GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}.gpg"
    dest: /etc/apt/keyrings/tailscale.asc
    mode: "0644"

- name: Ensure python3-apt for deb822_repository
  apt:
    name: python3-apt
    state: present

- name: Remove legacy Tailscale apt list file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/tailscale.list
    state: absent

- name: Add Tailscale repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: /etc/apt/keyrings/tailscale.asc
    state: present

- name: Update apt cache 
  apt:
    update_cache: yes

- name: Install Tailscale
  apt:
    name: tailscale
    state: present

- name: Start Tailscale service
  systemd:
    name: tailscaled
    state: started
    enabled: yes

- name: Authenticate Tailscale with auth key
  shell: tailscale up --authkey={{ TAILSCALE_AUTH_KEY }} \
    --hostname={{ TAILSCALE_HOSTNAME }}
  ignore_errors: true

- name: Get Tailscale IP
  shell: tailscale ip -4
  register: tailscale_ip
  changed_when: false

- name: Display Tailscale information
  debug:
    msg: |
      ✅ Tailscale configured successfully
      IP: {{ tailscale_ip.stdout }}
      Hostname: {{ TAILSCALE_HOSTNAME }}