---
# Install Docker from official repository with architecture detection
- name: Update apt cache
  apt:
    update_cache: yes

- name: Install prerequisites
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Ensure python3-apt for deb822_repository
  apt:
    name: python3-apt
    state: present

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker's official GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Get system architecture
  set_fact:
    docker_arch: "{{ docker_arch_mapping[ansible_facts['architecture']] }}"

- name: Remove legacy Docker apt list file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Add Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ docker_arch }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Update apt cache after adding Docker repo
  apt:
    update_cache: yes

- name: Install Docker packages
  apt:
    name: "{{ docker_packages }}"
    state: present
  notify: Restart Docker

- name: Create docker group
  group:
    name: "{{ docker_group }}"
    state: present

- name: Add current user to docker group
  user:
    name: "{{ docker_user }}"
    groups: "{{ docker_group }}"
    append: yes
  notify: Restart Docker

- name: Enable Docker service
  systemd:
    name: docker.service
    enabled: yes
    state: started

- name: Enable containerd service
  systemd:
    name: containerd.service
    enabled: yes

- name: Verify Docker installation
  command: docker --version
  register: docker_version
  changed_when: false

- name: Display Docker version and architecture
  debug:
    msg: |
      ✅ Docker installed successfully
      Version: {{ docker_version.stdout }}
      Architecture: {{ docker_arch }}
      User: {{ docker_user }}
