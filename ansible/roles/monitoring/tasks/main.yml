---
- name: Ensure prometheus data directory exists
  ansible.builtin.file:
    path: "{{ PATH_DATA }}/persistence/prometheus"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Ensure grafana data directories exist (uid 472 de la imagen grafana)
  ansible.builtin.file:
    path: "{{ PATH_DATA }}/persistence/grafana/{{ item }}"
    state: directory
    owner: "472"
    group: "0"
    mode: "0755"
  loop:
    - ""
    - dashboards

- name: Seed initial Grafana dashboard (no overwrite UI edits)
  ansible.builtin.copy:
    src: "{{ ansible_facts['env']['HOME'] }}/services/homelab/services/docker/grafana/seed/homelab.json"
    dest: "{{ PATH_DATA }}/persistence/grafana/dashboards/homelab.json"
    owner: "472"
    group: "0"
    mode: "0644"
    force: false
    remote_src: true

- name: Start monitoring services (prometheus, grafana, node-exporter, cadvisor)
  shell: |
    cd {{ ansible_facts['env']['HOME'] }}/services/homelab/services/docker
    PATH_DATA={{ PATH_DATA }} docker compose --profile monitoring --profile metrics up -d --remove-orphans 2>&1
  environment:
    GRAFANA_ADMIN_PASSWORD: "{{ GRAFANA_ADMIN_PASSWORD }}"
  register: monitoring_result
  changed_when: monitoring_result.stdout is search("Created|Started|Recreated")

- name: Reload prometheus configuration (SIGHUP; bind mount :ro no recrea el contenedor)
  command: docker exec prometheus kill -HUP 1
  changed_when: false
