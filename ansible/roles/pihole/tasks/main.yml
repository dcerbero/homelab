---
- name: Ensure pihole data directories exist (uid 1000, uniform with the rest)
  ansible.builtin.file:
    path: "{{ PATH_DATA }}/persistence/pihole/{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    - etc-pihole-v2
    - etc-dnsmasq.d

- name: (re)start pihole and set password
  ansible.builtin.shell: |
    cd {{ ansible_facts['env']['HOME'] }}/services/homelab/services/docker
    PATH_DATA={{ PATH_DATA }} \
      docker compose --profile dns up -d --remove-orphans 2>&1
    docker exec pihole pihole setpassword '{{ PIHOLE_PASS }}' 2>&1
  register: pihole_result
  changed_when: pihole_result.stdout is search("Created|Recreated|Started|Password changed")
