services:
  svcJellyfin:
    image: lscr.io/linuxserver/jellyfin:amd64-10.11.11
    container_name: jellyfin
    profiles:
      - media-streaming
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Bogota
    volumes:
      - "${PATH_DATA}/persistence/jellyfin/library:/config"
      - "${PATH_DATA}/media/tvseries:/data/tvshows"
      - "${PATH_DATA}/media/movies:/data/movies"
      # i965 VA-API driver: la imagen 10.11.11 (base Ubuntu 26.04) ya no lo incluye
      # (Mesa 25+ lo eliminó) y el QSV en gen7/Ivy Bridge lo necesita.
      - "/usr/lib/x86_64-linux-gnu/dri/i965_drv_video.so:/usr/lib/x86_64-linux-gnu/dri/i965_drv_video.so:ro"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    ports:
      - 8096:8096
    group_add:
      - "44"      # video
      - "993"     # render (gid en anton, único host que corre Jellyfin)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
