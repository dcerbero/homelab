services:
  svcJellyfin:
    image: lscr.io/linuxserver/jellyfin:arm64v8-10.10.7
    container_name: jellyfin
    profiles:
      - media-streaming
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Bogota
    volumes:
      - "${PATH_DATA}/persistence/jellyfin/library:/config"
      - "${PATH_DATA}/media/tvseries:/data/tvshows"
      - "${PATH_DATA}/media/movies:/data/movies"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    ports:
      - 8096:8096
    group_add:
      - "44"      # video
      - "107"     # render
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
