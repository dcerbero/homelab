services:
  svcProwlarr:
    image: lscr.io/linuxserver/prowlarr:amd64-2.5.2
    container_name: prowlarr
    profiles:
      - media-download
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Bogota
    volumes:
      - "${PATH_DATA}/persistence/prowlarr:/config"
    ports:
      - 8083:9696
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
