services:
  svcHeimdall:
    image: lscr.io/linuxserver/heimdall:2.7.6
    container_name: heimdall
    profiles:
      - dashboard
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Bogota
    volumes:
      - "${PATH_DATA}/persistence/heimdall/config:/config"
    restart: unless-stopped
