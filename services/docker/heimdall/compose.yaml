services:
  svcHeimdall:
    image: lscr.io/linuxserver/heimdall:2.7.6
    container_name: heimdall
    profiles:
      - dashboard
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Bogota
    volumes:
      - "${PATH_DATA}/persistence/heimdall/config:/config"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
