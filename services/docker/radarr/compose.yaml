services:
  svcRadarr:
    image: lscr.io/linuxserver/radarr:amd64-6.3.0
    container_name: radarr
    profiles:
      - media-download
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Bogota
    volumes:
      - "${PATH_DATA}/persistence/radarr:/config"
      # Mount común de /media: hardlinks de import entre descargas y biblioteca
      # (fallan con EXDEV en mounts separados; ver docs/media/README.md).
      - "${PATH_DATA}/media:/media"
    ports:
      - 8085:7878
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
