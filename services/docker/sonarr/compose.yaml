services:
  svcSonarr:
    image: linuxserver/sonarr:amd64-4.0.19
    container_name: sonarr
    profiles:
      - media-download
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Bogota
    volumes:
      - "${PATH_DATA}/persistence/sonarr/data:/config"
      - "${PATH_DATA}/media/tvseries:/tv"
      - "${PATH_DATA}/media/downloads:/downloads"
    ports:
      - 8084:8989
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
