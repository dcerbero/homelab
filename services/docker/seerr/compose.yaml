services:
  svcSeerr:
    image: seerr/seerr:v3.4.1
    container_name: seerr
    init: true
    profiles:
      - media-download
    environment:
      - LOG_LEVEL=info
      - TZ=America/Bogota
      - PORT=5055
    volumes:
      - "${PATH_DATA}/persistence/seerr:/app/config"
    ports:
      - 8087:5055
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5055/api/v1/settings/public"]
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
