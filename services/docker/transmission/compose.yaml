services:
  svcTransmission:
    container_name: transmission
    image: linuxserver/transmission:amd64-4.1.3
    profiles:
      - media-download
    ports:
      - 8082:9091
      - 51413:51413
      - 51413:51413/udp
    volumes:
      - "${PATH_DATA}/persistence/transmission/config:/config"
      - "${PATH_DATA}/media/downloads:/downloads"
      - "${PATH_DATA}/media/watch:/watch"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Bogota
      # La imagen linuxserver (4.x) habilita RPC auth solo con USER/PASS
      # (ignora TRANSMISSION_RPC_*); los valores vienen de TRANSMISSION_RPC_* en .env
      - USER=${TRANSMISSION_RPC_USERNAME}
      - PASS=${TRANSMISSION_RPC_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9091/transmission/web/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
