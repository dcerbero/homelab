services:
  svcTransmission:
    container_name: transmission
    image: linuxserver/transmission:arm64v8-4.0.6
    profiles:
      - media-download
    ports:
      - 8082:9091
      - 51413:51413
      - 51413:51413/udp
    volumes:
      - "${PATH_DATA}/persistence/transmission/config:/config"
      - "${PATH_DATA}/media/downloads:/downloads"
      - "${PATH_DATA}/media/watch:/watch"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Bogota
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9091/transmission/web/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
