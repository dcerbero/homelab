services:
  svcTransmission:
    container_name: transmission
    image: linuxserver/transmission:amd64-4.1.3
    profiles:
      - media-download
    ports:
      - 8082:9091
      - 51413:51413
      - 51413:51413/udp
    volumes:
      - "${PATH_DATA}/persistence/transmission/config:/config"
      # Mount común de /media: los hardlinks de import de Sonarr/Radarr fallan
      # (EXDEV) entre mounts separados del mismo filesystem; con un solo mount
      # compartido funcionan (ver docs/media/README.md).
      - "${PATH_DATA}/media:/media"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Bogota
      # La imagen linuxserver (4.x) habilita RPC auth solo con USER/PASS
      # (ignora TRANSMISSION_RPC_*); los valores vienen de TRANSMISSION_RPC_* en .env
      - USER=${TRANSMISSION_RPC_USERNAME}
      - PASS=${TRANSMISSION_RPC_PASSWORD}
    restart: unless-stopped
    healthcheck:
      # El Web UI devuelve 401 sin credenciales (RPC auth USER/PASS, ver env arriba).
      # Se usa $$USER/$$PASS (no $USER/$PASS): Compose interpola $VAR en parseo con
      # el env del shell que lo ejecuta (Ansible con become=root), lo que daría "root:";
      # $$ escapa un $ literal para que el shell del contenedor expanda las env suyas.
      test: ["CMD-SHELL", "curl -fsS -u \"$$USER:$$PASS\" http://localhost:9091/transmission/web/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
