services:
  svcNginx:
    image: nginx:1.29.1-bookworm
    container_name: nginx_proxy
    profiles:
      - infra
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./config/conf.d:/etc/nginx/conf.d:ro"
    healthcheck:
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
